name: XiangqiWisdom
options:
  bundleIdPrefix: io.leslie
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  XiangqiWisdom:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Pikafish/src
        excludes:
          - "main.cpp"
          - "benchmark.cpp"
          - "universal/*"
    dependencies:
      - target: BroadcastExtension
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 象棋智囊
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: XiangqiWisdom.SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.leslie.xiangqiwisdom
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Pikafish/src"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/BridgingHeader.h"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -DIS_64BIT -DUSE_NEON"
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: ScreenShare
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.leslie.xiangqiwisdom.broadcast
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  XiangqiWisdom:
    build:
      targets:
        XiangqiWisdom: all
    run:
      config: Debug
